name: Add detail tab transition

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/add_detail_tab_transition.py'
      - '.github/workflows/add-detail-tab-transition.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: python3 .github/scripts/add_detail_tab_transition.py
      - name: Commit changes
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Smooth detail tab switching"
          git push
