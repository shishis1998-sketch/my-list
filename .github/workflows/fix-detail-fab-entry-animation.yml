name: Fix detail FAB entry animation

on:
  push:
    paths:
      - '.github/workflows/fix-detail-fab-entry-animation.yml'
      - '.github/scripts/fix_detail_fab_entry_animation.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: python3 .github/scripts/fix_detail_fab_entry_animation.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Remove detail FAB entry fade"
          git push
