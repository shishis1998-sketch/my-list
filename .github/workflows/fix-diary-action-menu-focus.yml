name: Fix diary action menu focus

on:
  push:
    branches: [fix/diary-action-menu-focus]
    paths:
      - '.github/workflows/fix-diary-action-menu-focus.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch diary menu styles
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  """/* 日记长按菜单：图标＋文字，删除整行使用危险色。 */
          #diaryActionMenu{background:rgba(10,8,6,.16);}
          #diaryActionMenu .chapter-action-panel{width:184px;padding:6px;border-radius:var(--rlg);}""",
                  """/* 日记长按菜单：只标记当前卡片；菜单沿用应用的描边、无投影风格。 */
          #diaryActionMenu{background:transparent;}
          #diaryActionMenu .chapter-action-panel{
            width:184px;padding:6px;border:var(--bd) solid var(--ink);border-radius:var(--rlg);box-shadow:none;
          }
          #nlist .note-card.diary-action-selected{
            border-color:var(--accent);background:rgba(var(--accent-rgb),.08);
          }""",
              ),
              (
                  "let diaryActionId=null;",
                  "let diaryActionId=null,diaryActionCard=null;",
              ),
              (
                  """  if(!menu||!card)return;
            diaryActionId=id;""",
                  """  if(!menu||!card)return;
            if(diaryActionCard&&diaryActionCard!==card)diaryActionCard.classList.remove('diary-action-selected');
            diaryActionId=id;
            diaryActionCard=card;
            card.classList.add('diary-action-selected');""",
              ),
              (
                  """  if(menu){menu.classList.remove('open');menu.setAttribute('aria-hidden','true');}
            diaryActionId=null;""",
                  """  if(menu){menu.classList.remove('open');menu.setAttribute('aria-hidden','true');}
            if(diaryActionCard)diaryActionCard.classList.remove('diary-action-selected');
            diaryActionCard=null;
            diaryActionId=null;""",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match, found {count}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
      - name: Validate and commit
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('index.html','utf8');
          const blocks=[...s.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/gi)].map(m=>m[1]);
          blocks.forEach(code=>new Function(code));
          NODE
          git diff --check -- index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-diary-action-menu-focus.yml
          git add index.html
          git commit -m "调整日记长按菜单选中样式"
          git push
