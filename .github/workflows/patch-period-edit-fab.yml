name: Patch period edit FAB

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-period-edit-fab.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/patch.py
          python3 /tmp/patch.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: add period edit floating button"
          git push
