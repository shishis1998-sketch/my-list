name: Patch period edit FAB

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-period-edit-fab.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        shell: bash
        run: |
          echo ' g57uP5pyf5pyI6KeG5Zu+wrflj7PkuIvop5LnvJbovpHmjInpkq7jgILlsLrlr7jjgIHkvY3nva7lkozor6bmg73pnaLnmoQgLmR0LWZhYiDlr7npvZDvvJsKICAg5YWo56uZ57qv5bmz6Z2i77yM5LiN5Yqg6Zi05b2x44CC5oyJ6ZSu5bGC57qn5Zu65a6a5ZyoIDgw77yM57uP5pyf6YGt572pL+aKveWxieaYr+KAiDIwMC8yMDE77yM 入_' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "feat: add period edit floating button"
          git push
