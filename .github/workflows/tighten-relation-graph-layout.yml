name: Tighten relation graph layout
on:
  push:
    paths:
      - '.github/scripts/tighten_relation_graph_layout.py'
      - '.github/workflows/tighten-relation-graph-layout.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/tighten_relation_graph_layout.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix relation legend width and shorten graph lines"
          git push
