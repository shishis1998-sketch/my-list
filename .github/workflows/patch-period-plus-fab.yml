name: Apply period FAB plus icon
on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch-period-plus-fab.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match period FAB to detail FAB
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='''#calViewPeriod .pv-edit-fab{\n  display:none;place-items:center;position:fixed;z-index:80;\n  right:16px;bottom:calc(16px + 64px + env(safe-area-inset-bottom));\n  width:48px;height:48px;padding:0;border:0;border-radius:50%;\n  color:#fff;\n  background:linear-gradient(160deg,rgba(255,255,255,.22),rgba(255,255,255,0) 46%,rgba(0,0,0,.20)),var(--brand);\n  cursor:pointer;-webkit-tap-highlight-color:transparent;\n  transition:transform .16s ease,opacity .16s ease;\n}\nbody.cal-view-period #calViewPeriod .pv-edit-fab{display:grid;}\n#calViewPeriod .pv-edit-fab[hidden]{display:none !important;}\n#calViewPeriod .pv-edit-fab:active{transform:scale(.92);}\n#calViewPeriod .pv-edit-fab svg{width:22px;height:22px;}'''
          new='''#calViewPeriod .pv-edit-fab{\n  display:none;place-items:center;position:fixed;z-index:80;\n  right:var(--sp-16);bottom:calc(var(--sp-16) + 64px + env(safe-area-inset-bottom));\n  width:48px;height:48px;padding:0;border:0;border-radius:50%;\n  color:#fff;\n  background:linear-gradient(160deg,rgba(255,255,255,.22),rgba(255,255,255,0) 46%,rgba(0,0,0,.20)),var(--brand);\n  cursor:pointer;transition:transform .16s ease,opacity .16s ease;\n}\nbody.cal-view-period #calViewPeriod .pv-edit-fab{display:grid;}\n#calViewPeriod .pv-edit-fab[hidden]{display:none !important;}\n#calViewPeriod .pv-edit-fab:active{transform:scale(.92);}\n#calViewPeriod .pv-edit-fab svg{width:20px;height:20px;}'''
          if old not in s: raise SystemExit('period FAB CSS target not found')
          s=s.replace(old,new,1)
          oldsvg='''          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">\n            <path d="M4 19.5V21h1.5L16.8 9.7a2 2 0 0 0-2.8-2.8L4 17v2.5Z"/>\n            <path d="M12.9 8l2.8 2.8"/>\n            <path d="M12 17h8"/>\n            <path d="M14.5 20h5.5"/>\n          </svg>'''
          newsvg='''          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true">\n            <line x1="12" y1="5" x2="12" y2="19"/>\n            <line x1="5" y1="12" x2="19" y2="12"/>\n          </svg>'''
          if oldsvg not in s: raise SystemExit('period FAB icon target not found')
          s=s.replace(oldsvg,newsvg,1)
          p.write_text(s)
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: match period FAB to plus button"
          git push
