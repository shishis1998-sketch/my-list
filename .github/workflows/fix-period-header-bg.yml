name: Fix period header background

on:
  push:
    paths:
      - '.github/workflows/fix-period-header-bg.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore page background while keeping header sticky
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''body.cal-view-period #calViewPeriod .home-header{\n  position:sticky !important;\n  top:0 !important;\n  z-index:50;\n  background:#FFFFFF !important;\n}'''
          new = '''body.cal-view-period #calViewPeriod .home-header{\n  position:sticky !important;\n  top:0 !important;\n  z-index:50;\n  background:var(--bg) !important;\n}'''
          if old not in s:
              raise SystemExit('Target period header rule not found; aborting without changes')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/fix-period-header-bg.yml
          git add index.html .github/workflows/fix-period-header-bg.yml
          git commit -m "fix: keep period header sticky without white panel"
          git push
