name: Reset relation graph search
on:
  push:
    paths:
      - '.github/scripts/reset_relation_graph_search.py'
      - '.github/workflows/reset-relation-graph-search.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/reset_relation_graph_search.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Reset graph highlight when closing search"
          git push
