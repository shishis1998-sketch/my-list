name: Add detail swipe tabs

on:
  push:
    paths:
      - '.github/workflows/add-detail-swipe-tabs.yml'
      - '.github/scripts/add_detail_swipe_tabs.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: python3 .github/scripts/add_detail_swipe_tabs.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Add swipe navigation between detail tabs"
          git push
