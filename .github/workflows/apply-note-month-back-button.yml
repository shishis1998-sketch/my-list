name: Apply note month back button

on:
  push:
    branches: [fix/note-month-back-button]
    paths:
      - '.github/workflows/apply-note-month-back-button.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        shell: bash
        run: |
          echo '' | base64 -d | git apply
          git diff --check -- index.html
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-note-month-back-button.yml
          git add index.html
          git commit -m "将笔记月份返回键移到标题栏"
          git push
