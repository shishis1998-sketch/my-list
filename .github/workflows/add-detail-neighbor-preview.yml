name: Add adjacent detail preview

on:
  push:
    paths:
      - '.github/workflows/add-detail-neighbor-preview.yml'
      - '.github/scripts/add_detail_neighbor_preview.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: python3 .github/scripts/add_detail_neighbor_preview.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Preview adjacent detail tab while swiping"
          git push
