name: Remove detail entry fade

on:
  push:
    paths:
      - '.github/workflows/remove-detail-entry-fade.yml'
      - '.github/scripts/remove_detail_entry_fade.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: python3 .github/scripts/remove_detail_entry_fade.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Remove detail page entry fade"
          git push
