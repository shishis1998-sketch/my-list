name: Sync detail swipe progress

on:
  push:
    paths:
      - '.github/workflows/sync-detail-swipe-progress.yml'
      - '.github/scripts/sync_detail_swipe_progress.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: python3 .github/scripts/sync_detail_swipe_progress.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Synchronize detail swipe progress"
          git push
