name: Move relation graph controls into header
on:
  push:
    paths:
      - '.github/scripts/move_relation_graph_controls.py'
      - '.github/workflows/move-relation-graph-controls.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python .github/scripts/move_relation_graph_controls.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Move relation graph controls into header"
          git push
