name: Fix period FAB position
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-period-fab-position.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move period FAB to viewport root
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          btn='''        <!-- 经期月视图右下角编辑入口：选中日期后点这里编辑。 -->
        <button type="button" class="pv-edit-fab" id="pvEditFab" aria-label="编辑经期" title="编辑经期"
          onclick="PV.openEditFab()" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>

'''
          if btn not in s: raise SystemExit('period FAB markup not found')
          s=s.replace(btn,'',1)
          root='''</div><!-- /app -->

<!-- ===== 手机端底部栏（仅 ≤1024px 显示）===== -->'''
          root_insert='''</div><!-- /app -->

<!-- 经期月视图右下角编辑入口：放在 app 根节点外，确保 fixed 永远按视口定位。 -->
<button type="button" class="pv-edit-fab" id="pvEditFab" aria-label="编辑经期" title="编辑经期"
  onclick="PV.openEditFab()" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true">
    <line x1="12" y1="5" x2="12" y2="19"/>
    <line x1="5" y1="12" x2="19" y2="12"/>
  </svg>
</button>

<!-- ===== 手机端底部栏（仅 ≤1024px 显示）===== -->'''
          if root not in s: raise SystemExit('app root anchor not found')
          s=s.replace(root,root_insert,1)
          old='''#calViewPeriod .pv-edit-fab{
  display:none;place-items:center;position:fixed;z-index:80;
  right:var(--sp-16);bottom:calc(var(--sp-16) + 64px + env(safe-area-inset-bottom));
  width:48px;height:48px;padding:0;border:0;border-radius:50%;
  color:#fff;
  background:linear-gradient(160deg,rgba(255,255,255,.22),rgba(255,255,255,0) 46%,rgba(0,0,0,.20)),var(--brand);
  cursor:pointer;transition:transform .16s ease,opacity .16s ease;
}
body.cal-view-period #calViewPeriod .pv-edit-fab{display:grid;}
#calViewPeriod .pv-edit-fab[hidden]{display:none !important;}
#calViewPeriod .pv-edit-fab:active{transform:scale(.92);}
#calViewPeriod .pv-edit-fab svg{width:20px;height:20px;}'''
          new='''#pvEditFab{
  display:none;place-items:center;position:fixed;z-index:80;
  right:var(--sp-16);bottom:calc(var(--sp-16) + 64px + env(safe-area-inset-bottom));
  width:48px;height:48px;padding:0;border:0;border-radius:50%;
  color:#fff;
  background:linear-gradient(160deg,rgba(255,255,255,.22),rgba(255,255,255,0) 46%,rgba(0,0,0,.20)),#C72F49;
  cursor:pointer;transition:transform .16s ease,opacity .16s ease;
}
body.cal-view-period #pvEditFab{display:grid;}
#pvEditFab[hidden]{display:none !important;}
#pvEditFab:active{transform:scale(.92);}
#pvEditFab svg{width:20px;height:20px;}'''
          if old not in s: raise SystemExit('period FAB CSS not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: anchor period FAB to viewport"
          git push