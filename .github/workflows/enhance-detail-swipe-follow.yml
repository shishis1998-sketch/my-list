name: Enhance detail swipe follow

on:
  push:
    paths:
      - '.github/workflows/enhance-detail-swipe-follow.yml'
      - '.github/scripts/enhance_detail_swipe_follow.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: python3 .github/scripts/enhance_detail_swipe_follow.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Add follow-finger animation to detail swipe tabs"
          git push
