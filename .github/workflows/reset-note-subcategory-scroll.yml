name: Reset note subcategory scroll

on:
  push:
    branches: [fix/reset-note-subcategory-scroll]
    paths:
      - '.github/workflows/reset-note-subcategory-scroll.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        shell: bash
        run: |
          echo '' | base64 -d | git apply
          git diff --check -- index.html
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/reset-note-subcategory-scroll.yml
          git add index.html
          git commit -m "切换笔记子分类时回到顶部"
          git push
