name: Remove period date long press
on:
  push:
    branches: [main]
    paths: ['.github/workflows/remove-period-longpress.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove long press date editing
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.index('    // ── 事件处理：长按取消 / 单击循环（带滑动检测防误触）──')
          setup=s.index('    function setupEvents() {', start)
          pick=s.index('    // 单击某天：只把选中日切过去', setup)
          # 保留抽屉拖动逻辑，只替换日期事件变量 + setupEvents。
          prefix=s[start:setup]
          prefix=re.sub(r'^    // ── 事件处理：长按取消 / 单击循环（带滑动检测防误触）──\n    let pressTimer = null;\n    let didLongPress = false;\n    let pressMonth = 0, pressDay = 0;\n    let startX = 0, startY = 0;\n    let moved = false;\n    const MOVE_THRESHOLD = 10; // 像素，超过此距离视为滑动而非点击\n\n', '', prefix)
          new_setup='''    function setupEvents() {\n      const cal = document.getElementById('calendar');\n      // 日期只保留单击选择；编辑统一由右下角「＋」按钮进入。\n      cal.addEventListener('click', e => {\n        if (e.target.closest('.day-more')) return;\n        const el = e.target.closest('[data-day]') || e.target.closest('.daywrap')?.querySelector('.day[data-day]');\n        if (!el || homeView !== 'month') return;\n        pickDay(+el.dataset.month, +el.dataset.day);\n      });\n    }\n\n'''
          s=s[:start]+prefix+new_setup+s[pick:]
          s=s.replace('    // 长按才进编辑弹窗——记录经血量／症状是低频动作，浏览才是高频的。\n','')
          s=re.sub(r'    // 长按某天：弹出编辑弹窗[^\n]*\n    function editDay\(month, day\) \{\n      if \(homeView !== \'month\'\) return;\n      cardDay = \{ y: year, m: month, d: day \};\n      selectDayForView\(year, month, day\);\n      openDaySheet\(year, month, day\);\n    \}\n\n','',s,count=1)
          # 更新遗留说明，避免以后误以为仍有长按入口。
          s=s.replace('/* 长按现在是「打开编辑弹窗」，iOS 上要挡掉系统自己的长按选择/复制菜单 */','/* 日期格保持不可选中文字，避免触屏浏览时误选文本 */')
          s=s.replace('/* 日期格的 +N 只负责浏览完整标签；编辑仍由长按日期进入另一张抽屉。 */','/* 日期格的 +N 只负责浏览完整标签；编辑由右下角按钮进入。 */')
          s=s.replace('<!-- 日期标签 · 轻点 +N 后只读展开；长按日期仍进入下面的编辑抽屉 -->','<!-- 日期标签 · 轻点 +N 后只读展开；编辑由右下角按钮进入 -->')
          p.write_text(s,encoding='utf-8')
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: remove period date long-press editing"
          git push