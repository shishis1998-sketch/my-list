name: Simplify sync settings

on:
  push:
    paths:
      - '.github/workflows/simplify-sync-settings.yml'
      - '.github/scripts/simplify_sync_settings.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        run: python3 .github/scripts/simplify_sync_settings.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Simplify cloud sync settings"
          git push
